services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: main
      POSTGRES_PASSWORD: ecoprimers
      POSTGRES_USER: ecoprimers
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoprimers -d main"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
  storage:
    image: adobe/s3mock:5.1.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: assets
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico" ]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9090:9090"
    volumes:
      - storage-s3mock:/data

volumes:
  database:
  storage-s3mock:
