services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: main
      POSTGRES_PASSWORD: ecoprimers
      POSTGRES_USER: ecoprimers
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoprimers -d main"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
  storage:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: ecoprimers
      MINIO_ROOT_USER: ecoprimers
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
  storage-setup:
    image: quay.io/minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://storage:9000 ecoprimers ecoprimers && mc mb --ignore-existing local/assets"]

volumes:
  postgres:
  minio:
