{% extends "admin/base.html" %} {% block abody %}
<div class="d-flex justify-content-center align-items-center container">
  <div class="card my-4" style="width: 400px">
    <form class="card-body" method="POST" action="{{ url_for('admin_users_delete', id=user.id) }}">
      <div>
        <h5 class="card-title text-center">Delete User</h5>
      </div>
      <div>
        <p>Are you sure that you want to delete this user? Please re-enter the name of the user to confirm.</p>
        <p class="text-center">
          <b> {{ user.name }} </b>
        </p>
      </div>
      <div>
        <div>
          <label class="form-label" for="name">Confirm Name</label>
          <input class="form-control" type="text" id="name" name="name" placeholder="{{ user.name }}" required />
        </div>
      </div>
      <div class="d-flex justify-content-end mt-4 gap-2">
        <a class="btn btn-secondary" href="{{ url_for('admin_users') }}">Cancel</a>
        <button class="btn btn-danger" type="submit">Delete</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
