{% extends "admin/base.html" %} {% block abody %}
<div class="d-flex justify-content-center container py-3">
  <div class="card" style="width: 500px">
    <form
      class="card-body"
      method="POST"
      action="{{ url_for('admin_tasks_manage', id=task.id) }}"
      enctype="multipart/form-data"
    >
      <div>
        <h5 class="card-title text-center">Manage Task</h5>
      </div>
      <div class="vstack gap-2">
        <div>
          <label class="form-label" for="name">Name</label>
          <input class="form-control" type="text" id="name" name="name" value="{{ task.name }}" required />
        </div>
        <div>
          <label class="form-label" for="description">Description</label>
          <textarea class="form-control" id="description" name="description" rows="4" required>
{{ task.description }}</textarea
          >
        </div>
        <div>
          <label class="form-label" for="criteria">Critera</label>
          <textarea class="form-control" id="criteria" name="criteria" rows="2" required>{{ task.criteria }}</textarea>
        </div>
        <div>
          <label class="form-label" for="points">Points</label>
          <input
            class="form-control"
            type="number"
            id="points"
            name="points"
            min="0"
            value="{{ task.points }}"
            required
          />
        </div>
        <div>
          <label class="form-label" for="image">Image</label>
          {% if task.image_url %}
          <img class="img-fluid mb-2 w-100 rounded" src="{{ task.image_url }}" alt="{{ task.name }}" />
          {% endif %}
          <input class="form-control" type="file" id="image" name="image" />
        </div>
      </div>
      <div class="d-flex justify-content-end mt-4 gap-2">
        <a class="btn btn-secondary" href="{{ url_for('admin_tasks') }}">Cancel</a>
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
