{% extends "base.html" %} {% block title %}Donate{% endblock %} {% block body %}
<div class="container mt-5">
  <div class="card mx-auto p-4 shadow-lg" style="max-width: 500px; border-radius: 15px">
    <h1 class="text-success mb-4 text-center">Support Our Cause</h1>
    <p class="text-body-secondary text-center">
      Every contribution supports our environmental programs and community initiatives.
    </p>

    <form id="donation-form" method="post" action="{{ url_for('donation') }}">
      <div class="form-group mt-4">
        <label for="amount" class="form-label text-body-secondary">Donation Amount (SGD):</label>
        <input
          type="number"
          id="amount"
          name="amount"
          class="form-control form-control-lg border-primary"
          min="0.50"
          max="999999.00"
          step="0.01"
          placeholder="Enter amount (e.g., 10.00)"
          required
        />
      </div>
      <button type="submit" class="btn btn-success btn-lg mt-4 w-100">Donate Now</button>
    </form>
  </div>
</div>
{% endblock %}
