[project]
name = "ecoprimers"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic",
  "authlib",
  "boto3>=1.43.97",
  "flask",
  "flask-socketio",
  "flask-sqlalchemy",
  "newsapi-python",
  "openai",
  "pillow",
  "plotly",
  "psycopg[binary]",
  "python-dotenv",
  "requests",
  "resend",
  "sqlalchemy",
  "uvicorn",
  "xlsxwriter",
]

[dependency-groups]
dev = ["ruff", "ty"]

[tool.ruff]
line-length = 120
