[project]
name = "ecoprimers"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "authlib",
  "flask",
  "minio>=7.2,<8",
  "newsapi-python",
  "openai",
  "pg8000",
  "pillow",
  "pycryptodome",
  "python-dotenv",
  "requests",
  "resend",
  "sqlalchemy",
  "xlsxwriter",
]

[dependency-groups]
dev = ["alembic", "boto3>=1.43.97", "psycopg[binary]", "ruff", "ty", "workers-py", "workers-runtime-sdk"]

[tool.ruff]
line-length = 120
